name: Structural quality audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: ESLint + Lizard + jscpd
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Lizard
        run: python -m pip install --disable-pip-version-check "lizard==1.24.0"

      - name: Native JavaScript structural lint (audit only)
        shell: bash
        run: |
          set +e
          mkdir -p quality-audit
          npx --yes eslint@9.38.0 site \
            --no-config-lookup --ext .js,.mjs,.cjs \
            --rule 'max-lines: ["warn", {"max": 500, "skipBlankLines": true, "skipComments": true}]' \
            --rule 'max-lines-per-function: ["warn", {"max": 75, "skipBlankLines": true, "skipComments": true}]' \
            --rule 'complexity: ["warn", 15]' \
            --rule 'max-params: ["warn", 7]' \
            --rule 'max-depth: ["warn", 4]' \
            > quality-audit/eslint-structural.txt 2>&1
          status=$?
          cat quality-audit/eslint-structural.txt
          echo "eslint_status=$status" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Lizard structural metrics (audit only)
        shell: bash
        run: |
          set +e
          lizard site -C 15 -L 75 -a 7 -w > quality-audit/lizard.txt 2>&1
          status=$?
          cat quality-audit/lizard.txt
          echo "lizard_status=$status" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Copy/paste duplication audit (audit only)
        shell: bash
        run: |
          set +e
          npx --yes jscpd@5.0.12 site \
            --min-lines 8 --min-tokens 60 --format javascript \
            --reporters console,json --output quality-audit/jscpd \
            > quality-audit/jscpd-console.txt 2>&1
          status=$?
          cat quality-audit/jscpd-console.txt
          echo "jscpd_status=$status" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Enforce zero structural debt
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          count_eslint() { grep -Eo '✖ [0-9]+ problems?' "$1" | tail -1 | grep -Eo '[0-9]+' || echo 0; }
          count_lizard() { grep -c 'warning: .* NLOC,' "$1" || true; }
          count_clones() { grep -Eo 'Found [0-9]+ clones?\.' "$1" | tail -1 | grep -Eo '[0-9]+' || echo 0; }
          eslint_count="$(count_eslint quality-audit/eslint-structural.txt)"
          lizard_count="$(count_lizard quality-audit/lizard.txt)"
          clone_count="$(count_clones quality-audit/jscpd-console.txt)"
          {
            echo; echo "### Quality gate"; echo "- ESLint structural findings: $eslint_count"
            echo "- Lizard structural findings: $lizard_count"
            echo "- jscpd clone blocks: $clone_count"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$eslint_count" -eq 0 || { echo "::error::Jam Day must remain free of ESLint structural findings"; exit 1; }
          test "$lizard_count" -eq 0 || { echo "::error::Jam Day must remain free of Lizard structural findings"; exit 1; }
          test "$clone_count" -eq 0 || { echo "::error::Jam Day must remain free of copy/paste clone blocks"; exit 1; }

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-quality-audit-${{ github.sha }}
          path: quality-audit/
          if-no-files-found: warn
          retention-days: 7
